<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start X</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --bg: #0a0a0a; --text: #f0f0f0; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg) center/cover no-repeat fixed;
            color: var(--text);
            height: 100vh; overflow: hidden; position: relative;
        }
        .background { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, rgba(0,212,255,0.06) 0%, rgba(10,10,10,0.85) 65%); pointer-events: none; z-index: 1; }
        .search { position: absolute; top: 12px; left: 20px; right: 320px; max-width: 520px; z-index: 10; }
        .search-input { width: 100%; padding: 14px 24px; font-size: 1.25rem; font-weight: 500; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.08); border-radius: 9999px; color: white; outline: none; }
        .clock { position:absolute; top:10px; right:20px; z-index:30; text-align:right; width:260px; color:rgba(255,255,255,0.88); font-size:0.95rem; line-height:1.35; text-shadow:0 1px 4px #000; }
        .clock svg { width:110px; height:110px; display:block; margin-left:auto; }
        .clock .tz { font-size:1.15rem; font-weight:600; margin:2px 0; }
        .clock .lbl { font-size:0.8rem; color:rgba(255,255,255,0.6); margin-top:6px; }
        .clock .big { font-weight:600; }
        .clock .host { color:#ffd54a; font-weight:700; }
        .wx { position:absolute; right:20px; bottom:12px; z-index:30; width:250px; padding:8px 10px; border-radius:10px; background:rgba(0,0,0,0.5); font-size:0.8rem; color:rgba(255,255,255,0.85); text-align:right; }
        .icons-area { position:absolute; left:0; right:290px; top:78px; bottom:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; z-index:20; }
        .icon-row { display:flex; justify-content:center; align-items:center; gap:14px; width:100%; }
        .icon-sq { width:min(110px, calc((100% - 108px) / 7)); aspect-ratio:1; background:#fff; border-radius:10px; flex:0 0 auto; }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="search">
        <form action="https://www.google.com/search" method="get">
            <input class="search-input" name="q" placeholder="Search Google or ask anything..." autofocus>
        </form>
    </div>
    <div class="icons-area">
        <div class="icon-row"><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div></div>
        <div class="icon-row"><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div></div>
        <div class="icon-row"><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div><div class="icon-sq"></div></div>
    </div>
    <div class="wx" id="wx">weather</div>
</body>
</html>
