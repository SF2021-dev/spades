<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Board — Diamond Spaders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --felt: #10211c;
      --felt-2: #17302a;
      --panel: #1c3830;
      --line: #2f5146;
      --ivory: #f3efe4;
      --mist: #b7c3ba;
      --gold: #e0b15a;
      --ink: #1a140c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--felt); color: var(--ivory); font-family: "Source Sans 3", system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 24px; }
    @media (min-width: 640px) { header { flex-direction: row; align-items: flex-end; justify-content: space-between; } }
    .brand { display: flex; align-items: flex-start; gap: 12px; }
    .logo { color: var(--gold); margin-top: 4px; }
    .sub { font-family: Fraunces, Georgia, serif; font-size: 14px; letter-spacing: 0.04em; color: var(--gold); margin: 0; }
    h1 { font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; margin: 4px 0 0; line-height: 1.2; }
    .meta { margin: 4px 0 0; color: var(--mist); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; background: var(--gold); color: var(--ink); border: none; border-radius: 999px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:hover:not(:disabled) { filter: brightness(1.05); }
    #status { color: var(--mist); margin-bottom: 16px; min-height: 1.2em; }
    .error-note { background: #2a1a10; border: 1px solid #5a3a20; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; color: #f0d0a0; font-size: 14px; }
    .cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    @media (min-width: 768px) { .cards { display: none; } }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .time { font-weight: 600; margin: 0; }
    .game { font-family: Fraunces, Georgia, serif; font-size: 20px; margin: 2px 0 0; }
    .badge { background: var(--felt); color: var(--gold); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
    .host { color: var(--mist); margin: 8px 0 0; }
    .winner { margin: 12px 0 0; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .jump { color: var(--gold); margin-top: 12px; display: inline-block; text-decoration: underline; text-underline-offset: 2px; }
    .table-wrap { display: none; margin-bottom: 32px; }
    @media (min-width: 768px) { .table-wrap { display: block; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; } }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background: var(--felt-2); color: var(--mist); font-size: 14px; }
    th, td { padding: 12px 16px; }
    tbody tr { border-top: 1px solid var(--line); background: var(--panel); }
    a.gold { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; }
    .winners-section { margin-top: 24px; border-top: 3px solid var(--gold); padding-top: 16px; }
    .winners-section h2 { font-family: Fraunces, Georgia, serif; font-size: 18px; letter-spacing: 0.1em; color: var(--gold); margin: 0 0 12px; }
    .winners-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
    @media (max-width: 700px) { .winners-grid { grid-template-columns: 1fr; } }
    .winner-card { padding: 14px 10px; }
    .winner-card:nth-child(odd) { background: #1a1200; }
    .winner-card:nth-child(even) { background: #000; }
    .winner-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold); }
    .winner-name { font-size: 22px; font-weight: 800; }
    .winner-label { font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/>
          </svg>
        </span>
        <div>
          <p class="sub">Diamond Spaders</p>
          <h1>Today's board</h1>
          <p class="meta" id="dateMeta">Eastern time · Load today's tours</p>
        </div>
      </div>
      <button class="btn" id="loadBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
        Load today's tours
      </button>
    </header>

    <div id="errorNote" class="error-note" style="display:none;"></div>
    <p id="status">Click the button to load today's tours.</p>
    <div class="cards" id="cards"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Start</th><th>Game</th><th>Host</th><th>Jump</th><th>Status / Winner</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="winners-section" id="winnersSection" style="display:none;">
      <h2 id="winnersHeading">Yesterday's Winners</h2>
      <div class="winners-grid" id="winnersGrid"></div>
    </div>
  </div>

  <script>
    const loadBtn = document.getElementById('loadBtn');
    const statusEl = document.getElementById('status');
    const errorNote = document.getElementById('errorNote');
    const cardsEl = document.getElementById('cards');
    const tbody = document.getElementById('tbody');
    const dateMeta = document.getElementById('dateMeta');
    const winnersSection = document.getElementById('winnersSection');
    const winnersHeading = document.getElementById('winnersHeading');
    const winnersGrid = document.getElementById('winnersGrid');

    function clock12(h, m) {
      const hh = h % 12 || 12;
      const ampm = h >= 12 ? 'PM' : 'AM';
      return `${hh}:${String(m).padStart(2, '0')} ${ampm} EST`;
    }

    function statusFor(t) {
      if (t.winners && t.winners.length) return { text: 'Final', winner: t.winners.join(' & ') };
      if (t.pending) return { text: 'Live', winner: 'In progress' };
      return { text: 'Upcoming', winner: 'Not started' };
    }

    function renderTours(tours) {
      cardsEl.innerHTML = '';
      tbody.innerHTML = '';
      if (!tours.length) {
        statusEl.textContent = 'No tours found for today.';
        return;
      }
      statusEl.textContent = `Loaded ${tours.length} tour${tours.length === 1 ? '' : 's'}.`;
      tours.forEach(t => {
        const time = clock12(t.h, t.m);
        const st = statusFor(t);
        const jump = t.url || `https://cgi6.igl.net/tourney/diamondspaders/${t.id}/`;
        const game = (t.game || 'SPADES').toUpperCase().replace(/\s+/g, ' ').trim();

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-head">
            <div><p class="time">${time}</p><h2 class="game">${game}</h2></div>
            <span class="badge">${st.text}</span>
          </div>
          <p class="host">Host ${t.td || '—'}</p>
          <p class="winner" style="${st.winner === 'In progress' || st.winner === 'Not started' ? 'color:var(--mist)' : ''}">${st.winner}</p>
          <a class="jump" href="${jump}" target="_blank">Jump ${t.id || ''}</a>
        `;
        cardsEl.appendChild(card);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:600">${time}</td>
          <td>${game}</td>
          <td>${t.td || '—'}</td>
          <td><a class="gold" href="${jump}" target="_blank">${t.id || ''}</a></td>
          <td style="${st.winner === 'In progress' || st.winner === 'Not started' ? 'color:var(--mist)' : ''}">${st.winner}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderWinnersFromApi(days, today) {
      winnersGrid.innerHTML = '';
      const keys = Object.keys(days || {}).sort().reverse();
      const todayHas = days[today] && days[today].cells && days[today].cells.length;
      const sourceKey = todayHas ? keys[1] : keys[0];
      const source = days[sourceKey];
      if (!source || !source.cells || !source.cells.length) {
        winnersSection.style.display = 'none';
        return;
      }
      winnersHeading.textContent = todayHas ? "Yesterday's Winners" : source.heading || 'Winners';
      winnersSection.style.display = 'block';
      source.cells.forEach(html => {
        const div = document.createElement('div');
        div.className = 'winner-card';
        div.innerHTML = html;
        winnersGrid.appendChild(div);
      });
    }

    async function loadTours() {
      loadBtn.disabled = true;
      errorNote.style.display = 'none';
      statusEl.textContent = 'Loading from /api/live…';
      try {
        const res = await fetch('/api/live');
        if (!res.ok) throw new Error('api/live returned ' + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'api/live error');

        dateMeta.textContent = `${data.today || ''} · Eastern time`;

        const todayTours = (data.tours || []).filter(t => t.date === data.today)
          .sort((a, b) => (a.h - b.h) || (a.m - b.m));
        renderTours(todayTours);
        renderWinnersFromApi(data.days, data.today);
      } catch (err) {
        statusEl.textContent = 'Could not load tours.';
        errorNote.style.display = 'block';
        errorNote.textContent = err.message;
        cardsEl.innerHTML = '';
        tbody.innerHTML = '';
        winnersSection.style.display = 'none';
      } finally {
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener('click', loadTours);
    loadTours();
  </script>
</body>
</html>
