/* stale-page guard: if the server has a newer copy of this page than the one Edge cached, reload once */
(function () {
  function check() {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) {
      var lm = new Date(r.headers.get("last-modified")).getTime(), mine = new Date(document.lastModified).getTime();
      var tag = "stale-" + location.pathname + "-" + lm;
      if (lm && mine && Math.abs(lm - mine) > 2000 && !sessionStorage.getItem(tag)) { sessionStorage.setItem(tag, "1"); location.reload(); }

  }
  check();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();

        (function(){var g=document.getElementById('ticks'),h='';for(var i=0;i<12;i++){var a=i*Math.PI/6;h+='<line x1="'+(50+40*Math.sin(a))+'" y1="'+(50-40*Math.cos(a))+'" x2="'+(50+45*Math.sin(a))+'" y2="'+(50-45*Math.cos(a))+'" stroke="#ccc" stroke-width="'+(i%3?1.5:3)+'"/>';}g.innerHTML=h;})();
        var SKEW=0;function SNOW(){return new Date(Date.now()+SKEW);}function syncSkew(){var t0=Date.now();fetch('/api/live?skew='+t0,{method:'HEAD',cache:'no-store'}).then(function(r){var d=Date.parse(r.headers.get('date'));if(d)SKEW=d-(t0+Date.now())/2;if(Math.abs(SKEW)<3000)SKEW=0;updateClock();}).catch(function(){});}setTimeout(syncSkew,0);setInterval(syncSkew,600000);
        function tzParts(tz){var p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(SNOW()).forEach(function(x){p[x.type]=x.value;});p.hour=(+p.hour)%24;return p;}
        function hm(h,m){return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');}
        function hh(h,m){return hm(+h,+m);}
        function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
        function estAbbr(){var t=SNOW().toLocaleTimeString('en-US',{timeZone:'America/New_York',timeZoneName:'short'});return (t.match(/E[SD]T/)||['EST'])[0];}
        var TOURS=[],TERR=false;
        function rot(id,deg){document.getElementById(id).setAttribute('transform','rotate('+deg+' 50 50)');}
        function updateClock(){
            var v=tzParts('America/Vancouver');rot('hh',(v.hour%12)*30+(+v.minute)*0.5);rot('mh',(+v.minute)*6+(+v.second)*0.1);rot('sh',(+v.second)*6);
            var e=tzParts('America/New_York'),ab=estAbbr();
            document.getElementById('est').textContent=hh(e.hour,+e.minute)+' '+ab;
            var today=e.year+'-'+e.month+'-'+e.day,nowMin=e.hour*60+(+e.minute);
            var up=TOURS.filter(function(t){return (!t.dt||t.dt===today)&&(+t.h)*60+(+t.m)>nowMin;}).sort(function(a,b){return (a.h*60+ +a.m)-(b.h*60+ +b.m);});
            var nn=document.getElementById('nextName'),nx=document.getElementById('nextTime');
            if(TERR){nn.textContent='sign in for tours';nx.textContent='';}else if(!up.length){nn.textContent='done for today';nx.textContent='';}else{nn.textContent=up[0].game+(up[0].td?' w/ '+up[0].td:'');nx.textContent=hh(+up[0].h,+up[0].m)+' '+ab;}
            var hn=document.getElementById('hostName'),ht=document.getElementById('hostTime'),mo=document.getElementById('more');
            if(TERR){hn.textContent='sign in for tours';ht.textContent='';mo.innerHTML='';return;}
            var mine=up.filter(function(t){return /^fetch_?it_?up$/i.test(String(t.td||'').trim());});
            if(!mine.length){hn.textContent='none today';ht.textContent='';mo.innerHTML='';return;}
            hn.textContent=mine[0].game;ht.textContent=hh(+mine[0].h,+mine[0].m)+' '+ab;
            mo.innerHTML=mine.slice(1).map(function(t){return esc(hh(+t.h,+t.m)+' '+ab+' '+t.game);}).join('<br>');
        }

(function(){var area=document.querySelector('.icons-area'),busy=false;
function bal(){if(busy||!area)return;var rs=[].slice.call(area.querySelectorAll('.icon-row')).filter(function(r){return r.querySelector(':scope > a');});
var all=[];rs.forEach(function(r){[].slice.call(r.children).forEach(function(e){if(e.tagName==='A')all.push(e);});});
var n=rs.length;if(n<2)return;var base=Math.floor(all.length/n),extra=all.length%n,want=[];for(var i=0;i<n;i++)want.push(base+(i>=n-extra?1:0));
var ok=rs.every(function(r,i){return r.querySelectorAll(':scope > a').length===want[i];});if(ok)return;

<script>
(function(){
  document.querySelectorAll('.icon-wrapper').forEach(function(wrap){
    var dots = document.createElement('div');
    dots.className = 'icon-dots';
    dots.innerHTML = '⋮';
    dots.title = 'Options';
    wrap.appendChild(dots);

    var menu = document.createElement('div');
    menu.className = 'icon-menu';
    menu.innerHTML = '<button data-act="edit">Edit</button><button data-act="delete">Delete</button>';
    wrap.appendChild(menu);

    dots.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      document.querySelectorAll('.icon-menu.open, .icon-edit-menu.open, .icon-picker.open').forEach(function(m){ m.classList.remove('open'); });
      menu.classList.add('open');
    });

    menu.addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if (!btn) return;
      e.preventDefault(); e.stopPropagation();
      var act = btn.dataset.act;
      if (act === 'delete') {
        if (confirm('Delete this quick link?')) {
          wrap.remove();
          // persist via localStorage could be added here
        }
        menu.classList.remove('open');
      } else if (act === 'edit') {
        menu.classList.remove('open');
        var url = prompt('Enter new URL for this link:', wrap.href || '');
        if (!url) return;
        wrap.href = url;
        var editMenu = document.createElement('div');
        editMenu.className = 'icon-edit-menu open';
        editMenu.innerHTML = '<button data-ico="lib">Icon from public library</button><button data-ico="auto">Auto-generated icon</button><button data-ico="file">Icon from file</button>';
        wrap.appendChild(editMenu);
        editMenu.addEventListener('click', function(ev){
          var b = ev.target.closest('button');
          if (!b) return;
          ev.preventDefault(); ev.stopPropagation();
          var kind = b.dataset.ico;
          editMenu.remove();
          if (kind === 'lib') {
            var q = prompt('Search Brandfetch for an icon (e.g. safeway, github, google):', '');
            if (!q) return;
            var domain = q.includes('.') ? q : q + '.com';
            var picker = document.createElement('div');
            picker.className = 'icon-picker open';
            // Brandfetch CDN + fallbacks
            var samples = [
              'https://cdn.brandfetch.io/' + encodeURIComponent(domain) + '/w/400/h/400',
              'https://cdn.brandfetch.io/' + encodeURIComponent(domain) + '/icon',
              'https://logo.clearbit.com/' + encodeURIComponent(domain),
              'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=128',
              'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=64'
            ];
            samples.forEach(function(src){
              var img = document.createElement('img');
              img.src = src;
              img.title = 'Click to use';
              img.onerror = function(){ this.style.display='none'; };
              img.onclick = function(){ wrap.querySelector('img').src = src; picker.remove(); };
              picker.appendChild(img);
            });
            wrap.appendChild(picker);
          } else if (kind === 'auto') {
            // Auto-generated: use a screenshot service or favicon as fallback
            var img = wrap.querySelector('img');
            img.src = 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=128';
            alert('Auto-generated icon set (favicon of the page). For a real screenshot, a backend service would be needed.');
          } else if (kind === 'file') {
            var loc = prompt('Enter image file URL or path (e.g. icons/myicon.png or https://...):', '');
            if (loc) wrap.querySelector('img').src = loc;
          }
        });
      }
    });
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.icon-menu.open, .icon-edit-menu.open, .icon-picker.open').forEach(function(m){ m.classList.remove('open'); });
  });
})();
</script>
