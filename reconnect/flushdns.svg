<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="Arial,Helvetica,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e00"/></marker></defs><rect width="700" height="460" fill="#fff"/><rect x="20" y="20" width="660" height="300" fill="#0c0c0c" stroke="#666"/><rect x="20" y="20" width="660" height="40" fill="#333"/><text x="40" y="48" font-size="20" fill="#fff">Administrator: Command Prompt</text><ellipse cx="240" cy="40" rx="215" ry="22" fill="none" stroke="#e00" stroke-width="5"/><text x="40" y="110" font-size="24" fill="#ccc" font-family="Consolas,monospace">C:\Windows\system32&gt;<tspan fill="#fff" font-weight="bold">ipconfig /flushdns</tspan></text><text x="40" y="170" font-size="19" fill="#9f9" font-family="Consolas,monospace">Successfully flushed the DNS Resolver Cache.</text><rect x="470" y="345" width="190" height="90" rx="12" fill="#eee" stroke="#333" stroke-width="3"/><text x="565" y="403" font-size="30" text-anchor="middle" font-weight="bold">Enter ↵</text><line x1="370" y1="390" x2="460" y2="390" stroke="#e00" stroke-width="7" marker-end="url(#a)"/><text x="40" y="400" font-size="22">Then press Enter</text><text x="692" y="452" font-size="12" fill="#999" text-anchor="end">illustration – your screen may look a little different</text></svg>