        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg) center/cover no-repeat fixed;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-image 0.8s ease;
        }
        .background {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(0, 212, 255, 0.06) 0%, rgba(10, 10, 10, 0.85) 65%);
            pointer-events: none; z-index: 1;
        }
        .search {
            position: absolute;
            top: 12px; left: 20px;
            width: calc(100% - 280px); max-width: 520px; padding: 0; z-index: 10;
        }
        .search-input {
            width: 100%; padding: 14px 24px; font-size: 1.25rem; font-weight: 500;
            background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.08);
            border-radius: 9999px; color: white; outline: none;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .search-input:focus {
            border-color: var(--accent); background: rgba(255,255,255,0.11);
            box-shadow: 0 0 0 14px rgba(0,212,255,0.18); transform: scale(1.015);
        }
        .clock {
            position: absolute; top: 8px; right: 24px; font-size: 1.15rem; font-weight: 500;
            color: rgba(255,255,255,0.85); z-index: 30; text-align: right;
            line-height: 1.35;
        }
        .clock .est {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
        }
        .icons-area {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 56px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            pointer-events: none;
        }
        .icon-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .icon-wrapper {
            height: clamp(56px, min(calc((100vw - 160px) / 9), calc((100vh - 330px) / 3), 128px), 128px); width: clamp(56px, min(calc((100vw - 160px) / 9), calc((100vh - 330px) / 3), 128px), 128px); border-radius: 10px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.75); transition: all 0.35s;
            cursor: pointer;
            flex: 0 0 auto;
            background: rgba(0,0,0,0.25);
        }
        .icon-wrapper:hover {
            transform: scale(1.08) translateY(-6px);
            box-shadow: 0 16px 40px rgba(0,212,255,0.28);
        }
        .icon-wrapper img {
            height: 100%; width: 100%; object-fit: contain; display: block;
        }
        .hint {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            font-size: 0.82rem; color: rgba(255,255,255,0.28); z-index: 15;
            white-space: nowrap;
        }
    </style>
<script>
/* stale-page guard: if the server has a newer copy of this page than the one Edge cached, reload once */
(function () {
  function check() {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) {
      var lm = new Date(r.headers.get("last-modified")).getTime(), mine = new Date(document.lastModified).getTime();
      var tag = "stale-" + location.pathname + "-" + lm;
      if (lm && mine && Math.abs(lm - mine) > 2000 && !sessionStorage.getItem(tag)) { sessionStorage.setItem(tag, "1"); location.reload(); }
    }).catch(function () {});
  }
  check();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();
</script>

    <script>
        (function () {
            var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
            document.body.style.backgroundImage = 'url(bing-today.jpg?d=' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ')';
        })();

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('time').textContent = hours + ':' + minutes + ' ' + ampm;
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
            const estOptions = {
                timeZone: 'America/New_York',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            document.getElementById('est').textContent = 'EST ' + now.toLocaleTimeString('en-US', estOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();

        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        form.addEventListener('submit', function (e) {
            const query = input.value.trim();
            if (!query) {
                e.preventDefault();
                return;
            }
            setTimeout(function () { input.value = ''; }, 300);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                input.value = '';
                input.focus();
            }
        });

        document.body.addEventListener('click', function(e) {
            if (e.target === document.body || e.target.classList.contains('background')) {
                input.focus();
            }
        });
    </script>
