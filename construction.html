<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Spaders — Under Construction</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin:0; padding:0; background:#0a0a0a; color:#fbe646; font-family:Arial,Helvetica,sans-serif; }
    .wrap { max-width:1100px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
    .banner { width:100%; height:auto; max-height:160px; object-fit:contain; display:block; background:#0a0a0a; }
    .box { margin:48px auto; padding:36px 28px; max-width:560px; width:calc(100% - 40px); box-sizing:border-box; text-align:center;
           background:#120c08; border:2px solid #fbe646; border-radius:12px; }
    .spade { font-size:56px; line-height:1; color:#ffd84a; text-shadow:0 0 10px rgba(251,230,70,.5); }
    h1 { font-family:'Cinzel Decorative',Georgia,serif; font-weight:900; color:#ffd84a; font-size:30px; margin:16px 0 10px;
         text-shadow:0 0 6px rgba(251,230,70,.55),0 1px 0 #7a5a00; }
    p { color:#c9a227; font-size:17px; font-weight:700; margin:0; letter-spacing:.02em; }
  </style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="/dsaltbanner.png" alt="Diamond Spaders">
  <div class="box">
    <div class="spade">&#9824;</div>
    <h1>Under Construction</h1>
    <p>Under construction — check back soon.</p>
  </div>
</div>
</body>
</html>
