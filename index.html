<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Spaders</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fbe646; font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .banner { width: 100%; height: auto; max-height: 160px; object-fit: contain; display: block; background: #0a0a0a; }
    .section { padding: 16px; border-top: 3px solid #fbe646; }
    h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: 0.14em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
    .card { padding: 14px 10px; }
    .card:nth-child(odd) { background: #1a1200; }
    .card:nth-child(even) { background: #000; }
    .time { font-size: 13px; font-weight: 700; }
    .name { font-size: 22px; font-weight: 800; margin-top: 2px; }
    .status { padding: 20px; text-align: center; color: #c9a227; }
    .note { text-align: center; padding: 12px; font-size: 13px; color: #c9a227; }
    a { color: #fbe646; }
  </style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="https://diamondspaders.online/dsaltbanner.png" alt="Diamond Spaders">

  <div class="section">
    <h2>TODAY'S WINNERS</h2>
    <div id="today" class="grid"><div class="status">Loading latest winners…</div></div>
  </div>

  <div class="section">
    <h2>YESTERDAY</h2>
    <div id="yesterday" class="grid"><div class="status">Loading…</div></div>
  </div>

  <div class="note">
    Live data from MyLeague · No bot required<br>
    <a href="https://myleague.com/diamondspaders/tournaments" target="_blank">View full list on MyLeague</a>
  </div>
</div>

<script>
async function loadWinners() {
  const todayEl = document.getElementById("today");
  const yestEl = document.getElementById("yesterday");

  try {
    // Public CORS proxy so the browser can read MyLeague
    const proxy = "https://api.allorigins.win/raw?url=";
    const url = proxy + encodeURIComponent("https://myleague.com/diamondspaders/tournaments");
    const res = await fetch(url);
    const html = await res.text();

    // Very simple extraction of recent winner lines
    const winners = [];
    const lines = html.split(/\n|<br\s*\/?>/i);
    let currentDate = null;

    for (const raw of lines) {
      const line = raw.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      if (!line) continue;

      const dateMatch = line.match(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s+\w+\s+\d{1,2},\s+\d{4}/i);
      if (dateMatch) {
        currentDate = dateMatch[0];
        continue;
      }

      if (currentDate && (line.includes("vs") || line.match(/\d{1,2}:\d{2}/))) {
        const nameMatches = line.match(/[A-Z][a-zA-Z0-9_]{2,}/g) || [];
        winners.push({
          date: currentDate,
          text: line,
          names: nameMatches.slice(0, 3)
        });
      }
    }

    if (!winners.length) {
      todayEl.innerHTML = '<div class="status">No winners found right now.<br><a href="https://myleague.com/diamondspaders/tournaments" target="_blank">Check MyLeague</a></div>';
      yestEl.innerHTML = '<div class="status">—</div>';
      return;
    }

    const byDate = {};
    for (const w of winners) {
      if (!byDate[w.date]) byDate[w.date] = [];
      byDate[w.date].push(w);
    }

    const dates = Object.keys(byDate);
    const todayDate = dates[0] || "";
    const yestDate = dates[1] || "";

    function render(list) {
      if (!list || !list.length) return '<div class="status">None yet</div>';
      return list.slice(0, 9).map(w => {
        const names = (w.names || []).slice(0, 2).join(" & ") || "Winner";
        const short = w.text.split(" ").slice(0, 6).join(" ");
        return `<div class="card">
          <div class="time">${short}</div>
          <div class="name">${names}</div>
        </div>`;
      }).join("");
    }

    todayEl.innerHTML = render(byDate[todayDate]);
    yestEl.innerHTML = render(byDate[yestDate]);
  } catch (err) {
    todayEl.innerHTML = '<div class="status">Could not load winners.<br><a href="https://myleague.com/diamondspaders/tournaments" target="_blank">Open MyLeague</a></div>';
    yestEl.innerHTML = "";
  }
}

loadWinners();
</script>
</body>
</html>
