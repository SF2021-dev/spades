<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Spaders</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fbe646; font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .banner { width: 100%; height: auto; max-height: 160px; object-fit: contain; display: block; background: #0a0a0a; }
    .section { padding: 16px; border-top: 3px solid #fbe646; }
    h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: 0.14em; }
    .frame-wrap { background: #000; border: 1px solid #fbe646; border-radius: 8px; overflow: hidden; }
    iframe { width: 100%; height: 620px; border: 0; background: #fff; }
    .note { text-align: center; padding: 12px; font-size: 13px; color: #c9a227; }
    a { color: #fbe646; }
  </style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="https://diamondspaders.online/dsaltbanner.png" alt="Diamond Spaders">

  <div class="section">
    <h2>TODAY'S WINNERS</h2>
    <div class="frame-wrap">
      <iframe src="https://myleague.com/diamondspaders/tournaments" title="Live winners from MyLeague"></iframe>
    </div>
  </div>

  <div class="note">
    Live list from MyLeague · No bot required<br>
    <a href="https://myleague.com/diamondspaders/tournaments" target="_blank">Open full page on MyLeague</a>
  </div>
</div>
</body>
</html>
