<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Spaders — Player tours (last 30 days)</title>
<style>
  html, body { margin:0; padding:0; background:#0a0a0a; color:#fbe646; font-family:Arial,Helvetica,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:0 0 30px; }
  .banner { width:100%; height:auto; max-height:140px; object-fit:contain; display:block; }
  h1 { font-size:22px; letter-spacing:.08em; margin:14px 16px 4px; }
  .sub { color:#c9a227; font-size:13px; margin:0 16px 14px; }
  form { display:flex; gap:8px; margin:0 16px 14px; }
  input { flex:1; min-width:0; font-size:18px; padding:10px 12px; border-radius:8px; border:1px solid #fbe646; background:#161616; color:#fff; }
  button { font-size:18px; font-weight:800; padding:10px 18px; border-radius:8px; border:0; background:#fbe646; color:#120c08; cursor:pointer; }
  #out { margin:0 16px; }
  .total { font-size:20px; font-weight:800; color:#fff; margin:6px 0 12px; }
  .lg { border:1px solid #444; border-radius:10px; background:#161616; margin-bottom:10px; }
  .lg summary { cursor:pointer; padding:12px 14px; font-size:17px; font-weight:800; display:flex; justify-content:space-between; gap:10px; }
  .lg summary b { color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:6px 14px; border-top:1px solid #2a2a2a; color:#eee; }
  td a { color:#fbe646; }
  .muted { color:#c9a227; font-size:14px; }
  .sugg a { color:#fbe646; margin-right:10px; cursor:pointer; text-decoration:underline; }
  .home { display:inline-block; margin:18px 16px 0; color:#fbe646; font-weight:800; }
</style>
</head>
<body>
<div class="wrap">
<a href="https://diamondspaders.online/"><img class="banner" src="https://diamondspaders.online/dsaltbanner.png" alt="Diamond Spaders"></a>
<h1>PLAYER TOURS — LAST 30 DAYS</h1>
<div class="sub" id="range">Loading…</div>
<form id="f" autocomplete="off">
  <input id="q" list="names" placeholder="Player name" aria-label="Player name" autofocus>
  <datalist id="names"></datalist>
  <button>Search</button>
</form>
<div id="out"></div>
<a class="home" href="https://diamondspaders.online/">&larr; Diamond Spaders home</a>
</div>
<script>
(function () {
  var D = null, out = document.getElementById("out"), q = document.getElementById("q");
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var MON = ["Jan","Feb","Mar","Apr","May","June","July","Aug","Sept","Oct","Nov","Dec"];
  function fdate(iso) { var p = iso.split("-"); return MON[+p[1] - 1] + " " + (+p[2]); }
  function ftime(hm) { var p = hm.split(":"), h = +p[0]; return (h % 12 || 12) + ":" + p[1] + " " + (h >= 12 ? "PM" : "AM"); }
  function show(name) {
    var key = name.trim().toLowerCase();
    if (!key) { out.innerHTML = ""; return; }
    history.replaceState(null, "", "?p=" + encodeURIComponent(name.trim()));
    var e = D.players[key];
    if (!e) {
      var near = Object.keys(D.players).filter(function (k) { return k.indexOf(key) >= 0; }).slice(0, 12);
      out.innerHTML = '<div class="total">No tours found for “' + esc(name.trim()) + '” in the last 30 days.</div>'
        + (near.length ? '<div class="sugg muted">Did you mean: ' + near.map(function (k) { return '<a data-n="' + esc(D.players[k].n) + '">' + esc(D.players[k].n) + "</a>"; }).join("") + "</div>" : "");
      return;
    }
    var by = {};
    e.t.forEach(function (i) { var t = D.tours[i]; (by[t[0]] = by[t[0]] || []).push(t); });
    var leagues = Object.keys(by).sort(function (a, b) { return by[b].length - by[a].length; });
    var h = '<div class="total">' + esc(e.n) + ": " + e.t.length + " tour" + (e.t.length === 1 ? "" : "s") + " in " + leagues.length + " league" + (leagues.length === 1 ? "" : "s") + "</div>";
    leagues.forEach(function (L) {
      var list = by[L].slice().sort(function (a, b) { return (b[2] + b[3]).localeCompare(a[2] + a[3]); });
      h += '<details class="lg"><summary><span>' + esc(D.leagues[L] || L) + "</span><b>" + list.length + "</b></summary><table>";
      list.forEach(function (t) {
        h += "<tr><td>" + fdate(t[2]) + "</td><td>" + ftime(t[3]) + ' ET</td><td><a href="https://www.myleague.com/' + esc(t[0]) + "/tournament/" + esc(t[1]) + '/" target="_blank">' + esc(t[4] || "tour " + t[1]) + "</a></td></tr>";
      });
      h += "</table></details>";
    });
    out.innerHTML = h;
  }
  out.addEventListener("click", function (ev) { var n = ev.target.getAttribute && ev.target.getAttribute("data-n"); if (n) { q.value = n; show(n); } });
  document.getElementById("f").addEventListener("submit", function (ev) { ev.preventDefault(); if (D) show(q.value); });
  fetch("/playerx/data.json?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
    D = d;
    document.getElementById("range").textContent = fdate(d.from) + " – " + fdate(d.to) + " (ET) · " + Object.keys(d.leagues).length
      + " leagues: " + Object.keys(d.leagues).map(function (k) { return d.leagues[k]; }).join(", ") + " · counts checked-in tours · updated " + d.updated;
    var dl = document.getElementById("names");
    dl.innerHTML = Object.keys(d.players).map(function (k) { return '<option value="' + esc(d.players[k].n) + '">'; }).join("");
    var p = new URLSearchParams(location.search).get("p");
    if (p) { q.value = p; show(p); }
  }).catch(function () { document.getElementById("range").textContent = "Could not load player data."; });
})();
</script>
</body>
</html>
