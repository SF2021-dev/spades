    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) {

})();

    .then(function (html) {
      var key = '<div class="icons-area">', start = html.indexOf(key);
      if (start < 0) return;
      var i = start + key.length, depth = 1;
      while (i < html.length && depth) {
        var open = html.indexOf("<div", i), close = html.indexOf("</div>", i);
        if (close < 0) return;
        if (open !== -1 && open < close) { depth++; i = open + 4; }
        else { depth--; i = close + 6; }
      }
      var area = document.querySelector(".icons-area");
      if (area) area.innerHTML = html.slice(start + key.length, i - 6);
    }).catch(function () {});
})();
