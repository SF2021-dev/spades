<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Spaders</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fbe646; font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .banner { width: 100%; height: auto; max-height: 160px; object-fit: contain; display: block; background: #0a0a0a; }
    .section { padding: 16px; border-top: 3px solid #fbe646; }
    h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: 0.14em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
    .card { padding: 14px 10px; }
    .card:nth-child(odd) { background: #1a1200; }
    .card:nth-child(even) { background: #000; }
    .time { font-size: 13px; font-weight: 700; }
    .name { font-size: 22px; font-weight: 800; margin-top: 2px; }
    .partners { font-size: 14px; font-weight: 600; text-align: center; margin: 4px 0; }
    .status { padding: 20px; text-align: center; color: #c9a227; }
    .loading { opacity: 0.6; }
  </style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="https://diamondspaders.online/dsaltbanner.png" alt="Diamond Spaders">

  <div class="section">
    <h2>TODAY'S WINNERS</h2>
    <div id="today" class="grid"><div class="status">Loading latest winners…</div></div>
  </div>

  <div class="section">
    <h2>YESTERDAY</h2>
    <div id="yesterday" class="grid"><div class="status">Loading…</div></div>
  </div>

  <div style="text-align:center;padding:24px 10px;color:#c9a227;font-size:13px;">
    © 2026 Diamond Spaders · Data from MyLeague · No bot required
  </div>
</div>

<script>
async function loadWinners() {
  const todayEl = document.getElementById("today");
  const yestEl = document.getElementById("yesterday");

  try {
    const res = await fetch("/api/winners", { cache: "no-store" });
    const data = await res.json();

    if (!data.ok || !data.winners || !data.winners.length) {
      todayEl.innerHTML = '<div class="status">No winners found right now. Check back soon.</div>';
      yestEl.innerHTML = '<div class="status">—</div>';
      return;
    }

    // Group by date (very simple)
    const byDate = {};
    for (const w of data.winners) {
      const d = w.date || "Unknown";
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(w);
    }

    const dates = Object.keys(byDate);
    const todayDate = dates[0] || "";
    const yestDate = dates[1] || "";

    function render(list) {
      if (!list || !list.length) return '<div class="status">None yet</div>';
      return list.slice(0, 12).map(w => {
        const names = (w.names || []).slice(0, 2).join(" & ") || "Winner";
        return `<div class="card">
          <div class="time">${w.text.split(" ").slice(0, 4).join(" ")}</div>
          <div class="name">${names}</div>
        </div>`;
      }).join("");
    }

    todayEl.innerHTML = render(byDate[todayDate]);
    yestEl.innerHTML = render(byDate[yestDate]);
  } catch (err) {
    todayEl.innerHTML = '<div class="status">Could not load winners. Refresh the page.</div>';
    yestEl.innerHTML = "";
  }
}

loadWinners();
</script>
</body>
</html>
