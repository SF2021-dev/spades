<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Spaders</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fbe646; font-family: Arial, Helvetica, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .banner { width: 100%; height: auto; max-height: 160px; object-fit: contain; display: block; background: #0a0a0a; }
    .section { padding: 24px 16px; border-top: 3px solid #fbe646; text-align: center; }
    h2 { margin: 0 0 18px; font-size: 15px; letter-spacing: 0.14em; }
    .big-btn {
      display: inline-block;
      background: #fbe646;
      color: #111;
      font-weight: 800;
      font-size: 20px;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 10px;
      margin: 10px;
    }
    .big-btn:hover { background: #fff; }
    .note { margin-top: 20px; font-size: 14px; color: #c9a227; }
    .sub { font-size: 13px; color: #c9a227; margin-top: 6px; }
  </style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="https://diamondspaders.online/dsaltbanner.png" alt="Diamond Spaders">

  <div class="section">
    <h2>TODAY'S WINNERS</h2>
    <a class="big-btn" href="https://myleague.com/diamondspaders/tournaments" target="_blank">
      View Live Winners on MyLeague
    </a>
    <div class="sub">Opens the current list in a new tab</div>
  </div>

  <div class="section">
    <h2>RANKINGS & TOURS</h2>
    <a class="big-btn" href="https://myleague.com/diamondspaders/standings/" target="_blank">
      View Standings on MyLeague
    </a>
  </div>

  <div class="note">
    © 2026 Diamond Spaders · Live data from MyLeague · No bot required
  </div>
</div>
</body>
</html>
