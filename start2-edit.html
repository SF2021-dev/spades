<script>
(function () {
  function check() {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) {
      var lm = new Date(r.headers.get("last-modified")).getTime(), mine = new Date(document.lastModified).getTime();
      var tag = "stale-" + location.pathname + "-" + lm;
      if (lm && mine && Math.abs(lm - mine) > 2000 && !sessionStorage.getItem(tag)) { sessionStorage.setItem(tag, "1"); location.reload(); }
    }).catch(function () {});
  }
  check();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();

        (function(){var g=document.getElementById('ticks'),h='';for(var i=0;i<12;i++){var a=i*Math.PI/6;h+='<line x1="'+(50+40*Math.sin(a))+'" y1="'+(50-40*Math.cos(a))+'" x2="'+(50+45*Math.sin(a))+'" y2="'+(50-45*Math.cos(a))+'" stroke="#ccc" stroke-width="'+(i%3?1.5:3)+'"/>';}g.innerHTML=h;})();
        var SKEW=0;function SNOW(){return new Date(Date.now()+SKEW);}function syncSkew(){var t0=Date.now();fetch('/api/live?skew='+t0,{method:'HEAD',cache:'no-store'}).then(function(r){var d=Date.parse(r.headers.get('date'));if(d)SKEW=d-(t0+Date.now())/2;if(Math.abs(SKEW)<3000)SKEW=0;updateClock();}).catch(function(){});}setTimeout(syncSkew,0);setInterval(syncSkew,600000);
        function tzParts(tz){var p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(SNOW()).forEach(function(x){p[x.type]=x.value;});p.hour=(+p.hour)%24;return p;}
        function hm(h,m){return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');}
        function hh(h,m){return hm(+h,+m);}
        function esc(x){return String(x==null?'':x).replace(/[&<>\"]/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
        function estAbbr(){var t=SNOW().toLocaleTimeString('en-US',{timeZone:'America/New_York',timeZoneName:'short'});return (t.match(/E[SD]T/)||['EST'])[0];}
        var TOURS=[],TERR=false;
        function rot(id,deg){document.getElementById(id).setAttribute('transform','rotate('+deg+' 50 50)');}
        function updateClock(){
            var v=tzParts('America/Los_Angeles');rot('hh',(v.hour%12)*30+(+v.minute)*0.5);rot('mh',(+v.minute)*6+(+v.second)*0.1);rot('sh',(+v.second)*6);
            var e=tzParts('America/New_York'),ab=estAbbr();
            document.getElementById('est').textContent=hm(+e.hour,+e.minute)+' '+ab;
            var today=e.year+'-'+e.month+'-'+e.day,nowMin=e.hour*60+(+e.minute);
            var up=TOURS.filter(function(t){return (!t.dt||t.dt===today)&&(+t.h)*60+(+t.m)>nowMin;}).sort(function(a,b){return (a.h*60+ +a.m)-(b.h*60+ +b.m);});
            var nn=document.getElementById('nextName'),nx=document.getElementById('nextTime');
            if(TERR){nn.textContent='sign in for tours';nx.textContent='';}else if(!up.length){nn.textContent='done for today';nx.textContent='';}else{nn.textContent=up[0].game+(up[0].td?' w/ '+up[0].td:'');nx.textContent=hh(+up[0].h,+up[0].m)+' '+ab;}
            var hn=document.getElementById('hostName'),ht=document.getElementById('hostTime'),mo=document.getElementById('more');
            if(TERR){hn.textContent='sign in for tours';ht.textContent='';mo.innerHTML='';return;}
            var mine=TOURS.filter(function(t){
                if(!/^fetch_?it_?up$/i.test(String(t.td||'').trim())) return false;
                if(t.dt && t.dt < today) return false;
                if(t.dt && t.dt > today) return true;
                return (+t.h)*60+(+t.m)>nowMin;
            }).sort(function(a,b){return String(a.dt||'').localeCompare(String(b.dt||''))||((a.h*60+ +a.m)-(b.h*60+ +b.m));});
            if(!mine.length){hn.textContent='none today';ht.textContent='';mo.innerHTML='';return;}
            function stamp(t, timeOnly){var day=t.dt&&t.dt!==today?t.dt.slice(5).replace('-','/')+' ':'';return day+hh(+t.h,+t.m)+' '+ab+(timeOnly?'':' '+t.game);}
            hn.textContent=mine[0].game;ht.textContent=stamp(mine[0], true);
            mo.innerHTML=mine.slice(1).map(function(t){return esc(stamp(t));}).join('<br>');
        }

        function loadTemp(){var L=(window.wxCur&&wxCur())||{lat:49.28,lon:-123.12,name:'Vancouver B.C.'};fetch('https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon+'&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=4&wind_speed_unit=mph&temperature_unit=fahrenheit&timezone=auto').then(function(r){return r.json();}).then(function(j){try{var W=function(c){return c==0?'☀️ Clear':c<=2?'⛅ Partly cloudy':c==3?'☁️ Cloudy':c<=48?'🌫️ Fog':c<=67||(c>=80&&c<=82)?'🌧️ Rain':c<=77||c==85||c==86?'❄️ Snow':'⛈️ Storm';};var d=j.daily,h='<div class="now">'+L.name+' '+Math.round(j.current.temperature_2m)+'° '+W(j.current.weather_code)+' · wind '+Math.round(j.current.wind_speed_10m)+' mph</div>';for(var i=0;i<d.time.length;i++){var dn=i?new Date(d.time[i]+'T12:00').toLocaleDateString('en-US',{weekday:'short'}):'Today';h+='<div class="d"><span>'+dn+'</span><span>'+W(d.weather_code[i]).split(' ')[0]+'</span><span>'+Math.round(d.temperature_2m_max[i])+'° / '+Math.round(d.temperature_2m_min[i])+'°</span></div>';}document.getElementById('wx').innerHTML=h;}catch(e){}}).catch(function(){});}
