<script>
/* stale-page guard: if the server has a newer copy of this page than the one Edge cached, reload once */
(function () {
  function check() {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) {
      var lm = new Date(r.headers.get("last-modified")).getTime(), mine = new Date(document.lastModified).getTime();
      var tag = "stale-" + location.pathname + "-" + lm;
      if (lm && mine && Math.abs(lm - mine) > 2000 && !sessionStorage.getItem(tag)) { sessionStorage.setItem(tag, "1"); location.reload(); }
    }).catch(function () {});
  }
  check();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();

    <script>
        (function () {
            document.body.style.backgroundImage = 'url(/start-bg.jpg?v=20261026-mtshasta)';
        })();

        (function(){var g=document.getElementById('ticks'),h='';for(var i=0;i<12;i++){var a=i*Math.PI/6;h+='<line x1="'+(50+40*Math.sin(a))+'" y1="'+(50-40*Math.cos(a))+'" x2="'+(50+45*Math.sin(a))+'" y2="'+(50-45*Math.cos(a))+'" stroke="#ccc" stroke-width="'+(i%3?1.5:3)+'"/>';}g.innerHTML=h;})();
        function tzParts(tz){var p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});p.hour=(+p.hour)%24;return p;}
        function hm(h,m){return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');}
        function hh(h,m){return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
        function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
        function estAbbr(){var t=new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',timeZoneName:'short'});return (t.match(/E[SD]T/)||['EST'])[0];}
        var TOURS=[],TERR=false;
        function rot(id,deg){document.getElementById(id).setAttribute('transform','rotate('+deg+' 50 50)');}
        function updateClock(){
            var v=tzParts('America/Vancouver');rot('hh',(v.hour%12)*30+(+v.minute)*0.5);rot('mh',(+v.minute)*6+(+v.second)*0.1);rot('sh',(+v.second)*6);
            var e=tzParts('America/New_York'),ab=estAbbr();
            document.getElementById('est').textContent=hh(e.hour,+e.minute)+' '+ab;
            var today=e.year+'-'+e.month+'-'+e.day,nowMin=e.hour*60+(+e.minute);
            var up=TOURS.filter(function(t){return (!t.dt||t.dt===today)&&(+t.h)*60+(+t.m)>nowMin;}).sort(function(a,b){return (a.h*60+ +a.m)-(b.h*60+ +b.m);});
            var nn=document.getElementById('nextName'),nx=document.getElementById('nextTime');
            if(TERR){nn.textContent='sign in for tours';nx.textContent='';}else if(!up.length){nn.textContent='done for today';nx.textContent='';}else{nn.textContent=up[0].game+(up[0].td?' w/ '+up[0].td:'');nx.textContent=hh(+up[0].h,+up[0].m)+' '+ab;}
            var hn=document.getElementById('hostName'),ht=document.getElementById('hostTime'),mo=document.getElementById('more');
            if(TERR){hn.textContent='sign in for tours';ht.textContent='';mo.innerHTML='';return;}
            var mine=up.filter(function(t){return /^fetch_?it_?up$/i.test(String(t.td||'').trim());});
            if(!mine.length){hn.textContent='none today';ht.textContent='';mo.innerHTML='';return;}
            hn.textContent=mine[0].game;ht.textContent=hh(+mine[0].h,+mine[0].m)+' '+ab;
            mo.innerHTML=mine.slice(1).map(function(t){return esc(hh(+t.h,+t.m)+' '+ab+' '+t.game);}).join('<br>');
        }
        function loadTours(){fetch('/api/live',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){TOURS=j.tours||[];TERR=false;updateClock();}).catch(function(){TERR=true;updateClock();});}
        function loadTemp(){fetch('https://api.open-meteo.com/v1/forecast?latitude=49.28&longitude=-123.12&current=temperature_2m&temperature_unit=fahrenheit&timezone=America/Vancouver').then(function(r){return r.json();}).then(function(j){document.getElementById('temp').textContent=Math.round(j.current.temperature_2m)+'\u00b0 Vancouver B.C.';}).catch(function(){});}
        setInterval(updateClock,1000);updateClock();loadTours();setInterval(loadTours,300000);loadTemp();setInterval(loadTemp,900000);

        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        form.addEventListener('submit', function (e) {
            const query = input.value.trim();
            if (!query) {
                e.preventDefault();
                return;
            }
            setTimeout(function () { input.value = ''; }, 300);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                input.value = '';
                input.focus();
            }
        });

        document.body.addEventListener('click', function(e) {
            if (e.target === document.body || e.target.classList.contains('background')) {
                input.focus();
            }
        });
    </script>
